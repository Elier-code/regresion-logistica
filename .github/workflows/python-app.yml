name: Crear EXE de Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear EXE
        run: |
          pyinstaller --onefile --windowed regresion_logistica.py

      - name: Guardar EXE
        uses: actions/upload-artifact@v6
        with:
          name: regresion-logistica-windows
          path: dist/regresion_logistica.exe
